<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Najma project diagram">
  <rect width="800" height="400" fill="#dff3ef"/>
  <text x="400" y="50" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#1c2230">Najma</text>
  <!-- Drone -->
  <g transform="translate(130,190)">
    <rect x="-40" y="-10" width="80" height="20" rx="8" fill="#0f766e"/>
    <line x1="-40" y1="0" x2="-70" y2="-20" stroke="#1c2230" stroke-width="4"/>
    <line x1="40" y1="0" x2="70" y2="-20" stroke="#1c2230" stroke-width="4"/>
    <ellipse cx="-70" cy="-24" rx="28" ry="5" fill="#5b6475"/>
    <ellipse cx="70" cy="-24" rx="28" ry="5" fill="#5b6475"/>
  </g>
  <text x="130" y="270" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1c2230">UAV captures scene</text>
  <!-- Arrow -->
  <line x1="230" y1="190" x2="310" y2="190" stroke="#1c2230" stroke-width="3"/>
  <polygon points="310,182 326,190 310,198" fill="#1c2230"/>
  <!-- AI -->
  <rect x="340" y="140" width="120" height="100" rx="14" fill="#0f766e"/>
  <text x="400" y="200" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#fff">AI</text>
  <text x="400" y="270" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1c2230">Agents + RAG</text>
  <!-- Arrow -->
  <line x1="475" y1="190" x2="555" y2="190" stroke="#1c2230" stroke-width="3"/>
  <polygon points="555,182 571,190 555,198" fill="#1c2230"/>
  <!-- Report -->
  <rect x="600" y="130" width="100" height="120" rx="6" fill="#fff" stroke="#1c2230" stroke-width="3"/>
  <line x1="615" y1="160" x2="685" y2="160" stroke="#5b6475" stroke-width="4"/>
  <line x1="615" y1="180" x2="685" y2="180" stroke="#5b6475" stroke-width="4"/>
  <line x1="615" y1="200" x2="670" y2="200" stroke="#5b6475" stroke-width="4"/>
  <line x1="615" y1="220" x2="685" y2="220" stroke="#5b6475" stroke-width="4"/>
  <text x="650" y="280" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1c2230">Accident report</text>
</svg>
